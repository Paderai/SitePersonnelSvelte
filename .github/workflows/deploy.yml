name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # Restaure node_modules tel quel si package-lock.json n'a pas changé
      - name: Cache node_modules
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm run test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Ne déployer que sur un push vers main (pas depuis une PR)
    if: github.event_name == 'push'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd /var/www/francoisprovencher
            PREVIOUS=$(git rev-parse HEAD)
            # Le VPS reflète exactement main : toute modification locale est écrasée
            git fetch origin main
            git reset --hard origin/main
            # Réinstalle les dépendances exactes du lockfile seulement s'il a changé
            if [ ! -d node_modules ] || ! git diff --quiet "$PREVIOUS" HEAD -- package-lock.json; then
              echo "package-lock.json modifié : npm ci"
              npm ci
            else
              echo "Dépendances inchangées : npm ci sauté"
            fi
            npm run build
            echo "Deployed $(git rev-parse --short HEAD) at $(date)"
